name: Release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Check runtime dependency lock
        shell: bash
        run: |
          runtime_lock="$(mktemp)"
          trap 'rm -f "${runtime_lock}"' EXIT
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements.txt --output-file "${runtime_lock}" >/dev/null
          diff -u requirements-runtime.lock "${runtime_lock}"

      - name: Compile Python files
        run: uv run python -m compileall -q doom_deck_setup.py src tests

      - name: Lint Python files
        run: uv run ruff check .

      - name: Type check Python files
        run: uv run ty check

      - name: Check installer syntax
        run: sh -n install.sh

      - name: Run tests
        run: uv run pytest

      - name: Check CLI entry points
        run: |
          uv run doomdeck --help
          uv run python -m doomdeck --help
          python3 doom_deck_setup.py --help

      - name: Build package
        run: uv build --clear

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine release
        id: release-plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'
          next_version="$(uv run semantic-release version --print | sed -nE "/${semver_pattern}/ {p; q;}")"
          force_patch=false

          if [[ -z "${next_version}" ]]; then
            echo "Could not determine the next release version." >&2
            exit 1
          fi

          next_tag="v${next_version}"
          if git rev-parse --verify --quiet "refs/tags/${next_tag}" >/dev/null; then
            if git merge-base --is-ancestor "${next_tag}^{commit}" HEAD; then
              echo "release_needed=false" >> "${GITHUB_OUTPUT}"
              echo "No release needed; ${next_tag} is already reachable from this branch."
              exit 0
            fi

            next_version="$(uv run semantic-release version --patch --print | sed -nE "/${semver_pattern}/ {p; q;}")"
            next_tag="v${next_version}"
            force_patch=true
            if git rev-parse --verify --quiet "refs/tags/${next_tag}" >/dev/null; then
              echo "Recovery tag ${next_tag} already exists; reconcile release history manually." >&2
              exit 1
            fi
          fi

          {
            echo "release_needed=true"
            echo "version=${next_version}"
            echo "tag=${next_tag}"
            echo "force_patch=${force_patch}"
          } >> "${GITHUB_OUTPUT}"
          echo "Release needed: ${next_tag}"

      - name: Create release commit and tag
        if: steps.release-plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMIT_AUTHOR: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        run: |
          if [[ "${{ steps.release-plan.outputs.force_patch }}" == "true" ]]; then
            uv run semantic-release version --patch
          else
            uv run semantic-release version
          fi

      - name: Upload package artifacts to GitHub release
        if: steps.release-plan.outputs.release_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run semantic-release publish --tag "${{ steps.release-plan.outputs.tag }}"
