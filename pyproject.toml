[project]
name = "doomdeck"
version = "0.2.0"
description = "Steam Deck Doom modding setup automation for Doom Runner, UZDoom, Brutal Doom, and Project Brutality."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "black>=26.5.1",
    "pydantic>=2.13.0,<3.0.0",
]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nathaniel Ledford", email = "nate@nateledford.com" },
]
keywords = [
    "brutal-doom",
    "doom",
    "doom-runner",
    "game-modding",
    "linux-gaming",
    "proton",
    "project-brutality",
    "steam-deck",
    "steam-input",
    "uzdoom",
    "windows-gaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Installation/Setup",
]
[project.urls]
Homepage = "https://github.com/nledford/DoomDeck"
Repository = "https://github.com/nledford/DoomDeck"
Issues = "https://github.com/nledford/DoomDeck/issues"

[project.scripts]
doomdeck = "doomdeck.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-bdd>=8.1.0",
    "pytest-cov>=7.1.0",
    "python-semantic-release>=10.5.3",
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
    "ruff>=0.15.15",
    "tomli>=2.4.1",
    "ty>=0.0.42",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
]

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.semantic_release]
allow_zero_version = true
assets = ["uv.lock"]
build_command = "uv lock && uv build --clear"
commit_message = "chore(release): v{version} [skip ci]\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
major_on_zero = true
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/doomdeck/__init__.py:__version__"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = true

[tool.semantic_release.publish]
upload_to_vcs_release = true
